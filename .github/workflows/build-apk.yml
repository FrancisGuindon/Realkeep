name: Verify and build APK
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a signed release using the persistent release key
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint, and APKs
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease -PunsignedReleaseForVerification
      - name: Adaptive merge regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 tools/test_download_fixture.py
      - name: Nested native alignment
        run: python3 tools/check_native_alignment.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ReelKeep-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.signed_release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.REELKEEP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.REELKEEP_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" || { echo 'Configure both REELKEEP signing secrets'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reelkeep-release.p12"
      - name: Build signed release
        env:
          REELKEEP_STORE_FILE: ${{ runner.temp }}/reelkeep-release.p12
          REELKEEP_STORE_PASSWORD: ${{ secrets.REELKEEP_STORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify release
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee signing-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          python3 tools/check_native_alignment.py "$apk"
          sha256sum "$apk" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ReelKeep-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            SHA256SUMS.txt
            signing-certificate.txt
          if-no-files-found: error
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/reelkeep-release.p12"
